trigger: none

pool: OrionPool

stages:
  - stage: terraforminitoplan
    displayName: TerraformInitPlan
    jobs:
    - job: Terraforminstall
      steps:
      - task: TerraformInstaller@1
        inputs:
          terraformVersion: 'latest'

    - job: Terraforminit
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/NebulaForge'
          backendServiceArm: 'orion-NebulaCore Platform'
          backendAzureRmStorageAccountName: 'storion'
          backendAzureRmContainerName: 'storionc'
          backendAzureRmKey: '.tfstate'

      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'validate'
          workingDirectory: '$(System.DefaultWorkingDirectory)/NebulaForge'

      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: '$(System.DefaultWorkingDirectory)/NebulaForge'
          environmentServiceNameAzureRM: 'orion-NebulaCore Platform'

  - stage: scanning
    displayName: scanning of code
    jobs:
    - job: tfsec
      steps:
      - task: tfsec@1
        inputs:
            version: 'v1.26.0'
            dir: '$(System.DefaultWorkingDirectory)/NebulaForge'

  - stage: ManualValidation
    jobs:
      - job: Manualvalidation
        pool: server 
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'vipulsingh463@gmail.com'
            approvers: 'vipulsingh463@gmail.com'
            onTimeout: 'resume'

  - stage: TerraformApply
    jobs:
      - job: TerraformApply
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/NebulaForge'
            backendServiceArm: 'orion-NebulaCore Platform'
            backendAzureRmStorageAccountName: 'storion'
            backendAzureRmContainerName: 'storionc'
            backendAzureRmKey: '.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/NebulaForge'
            commandOptions: '-auto-approve'
            environmentServiceNameAzureRM: 'orion-NebulaCore Platform'