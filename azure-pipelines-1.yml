trigger:
- main
- feature/*

pool: OrionPool

jobs:
- job: TerraformInitPlan
  displayName: "Terraform Init to Plan"
  pool: OrionPool
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'
  
  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(System.DefaultWorkingDirectory)/infra-practice'
      backendServiceArm: 'orion-NebulaCore Platform'
      backendAzureRmStorageAccountName: 'storion'
      backendAzureRmContainerName: 'storionc'
      backendAzureRmKey: 'terraform.tfstate'

  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'plan'
      workingDirectory: '$(System.DefaultWorkingDirectory)/infra-practice'
      environmentServiceNameAzureRM: 'orion-NebulaCore Platform'
  
- job: ManulaValidation
  displayName: "Please do Manual Validation"
  dependsOn: TerraformInitPlan
  pool: server
  steps:
  - task: ManualValidation@1
    inputs:
      notifyUsers: 'vipulsingh463@gmail.com'
      approvers: 'vipulsingh463@gmail.com'
      instructions: 'Please Review it once before approving .'

- job: TerraformAplly
  displayName: "Terraform Apply"
  dependsOn: ManulaValidation
  pool: OrionPool
  steps:
  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '$(System.DefaultWorkingDirectory)/infra-practice'
      commandOptions: '-auto-approve'
      environmentServiceNameAzureRM: 'orion-NebulaCore Platform'
